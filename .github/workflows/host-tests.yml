name: Host tests

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install -r tools/requirements.txt
      # Hardware and native dialog checks are deliberately manual.
      - run: python -m unittest discover -s tools -p test_codex_usage.py -v
      - run: python -m unittest discover -s tools -p test_dashboard_agent.py -v
      - run: python -m unittest discover -s tools -p test_ai_usage.py -v
      - run: python -m unittest discover -s tools -p test_device_settings.py -v
      - run: python -m unittest discover -s tools -p test_desktop_settings.py -v
      - run: python -m unittest discover -s tools -p test_pc_screen.py -v
